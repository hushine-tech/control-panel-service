server:
  http_addr: ":8082"
  grpc_addr: ":50054"

runtime_channel_server:
  grpc_addr: ":50055"
  dependency_profile:
    schema_version: 1
    name: "platform-python-3.13"
    version: "1.0.0"
    contract_sha256: "8457b3c35618558fc8bfc74d4135b7eb52e00c33a8c9a49d202830f3fd5b62c5"
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
    server_name: "runtime-channel.local"
    client_ca_file: ""
    client_ca_key_file: ""

database:
  host: "127.0.0.1"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "control_panel"
  sslmode: "disable"

market_data:
  host: "127.0.0.1"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "{exchange}_{year}"
  sslmode: "disable"
  live_delivery_enabled: true
  kafka_brokers: ["127.0.0.1:9092"]

dependencies:
  portfolio_service_grpc: "127.0.0.1:50051"
  order_service_grpc: "127.0.0.1:50051"

# Platform-wide caps. Effective per-user limits combine plan and platform
# according to applyPlatformCap (plan/resolver.go):
#   *  -1  → unlimited on this side
#   *   0  → hard cap of 0 (forbidden); takes precedence
#   *  >0  → the smaller of the two non-unlimited sides; if the other
#           side is unlimited, this side wins
# Don't leave these as 0 unless you really mean "deny all"; use -1 for
# "no platform cap".
runtime_platform:
  max_total_hosted_runtimes: 50
  max_total_self_hosted_runtimes: 100
  default_plan_code: "pro"
  heartbeat_grace_seconds: 30
  death_grace_seconds: 300
  bare_runtime_death_grace_seconds: 300
  debug_bare_runtime_enabled: false
  bare_bootstrap_ip_allowlist: ["127.0.0.1/32"]
  bare_certificate_ttl: "8h"

runtime_plans:
  # Plan limits use the same convention as runtime_platform above:
  #   0  → forbidden (hard cap of 0)
  #  -1  → unlimited
  #  >0  → real cap
  free:
    max_hosted_runtimes: 1
    max_self_hosted_runtimes: 0   # forbidden for free plan
    max_routing_enabled_runtimes: 1
    max_concurrent_sessions_total: 2
    max_concurrent_sessions_per_runtime: 2
    allowed_resource_profiles: ["small"]
    allow_self_hosted_runtime: false
    allow_ide_debug: false
  developer:
    max_hosted_runtimes: 2
    max_self_hosted_runtimes: 2
    max_routing_enabled_runtimes: 3
    max_concurrent_sessions_total: 5
    max_concurrent_sessions_per_runtime: 3
    allowed_resource_profiles: ["small", "medium"]
    allow_self_hosted_runtime: true
    allow_ide_debug: false
  pro:
    max_hosted_runtimes: 5
    max_self_hosted_runtimes: 10
    max_routing_enabled_runtimes: 10
    max_concurrent_sessions_total: 20
    max_concurrent_sessions_per_runtime: 5
    allowed_resource_profiles: ["small", "medium", "large"]
    allow_self_hosted_runtime: true
    allow_ide_debug: true

# Phase D1 section 5 — hosted runtime provisioning.
#   backend: ""/"noop" → NoOpProvisioner (EnsureHostedRuntime fails closed)
#           "docker"   → DockerProvisioner (real `docker run`)
provisioning:
  backend: "docker"
  image: "hushine/strategy-runtime:executor-dev"
  registration_timeout_seconds: 30
  profiles:
    small:
      nano_cpus: "0.5"
      memory_mb: 512
      pids_limit: 256
    medium:
      nano_cpus: "1.0"
      memory_mb: 1024
      pids_limit: 512
    large:
      nano_cpus: "2.0"
      memory_mb: 2048
      pids_limit: 1024
  # DockerProvisioner-specific settings. Ignored when backend != "docker".
  docker:
    # "host" = container shares host network (simplest single-host dev).
    # "bridge" / custom = container gets its own network namespace.
    # Runtime session traffic is outbound RuntimeChannel only; no strategy
    # gRPC port is published from the hosted container.
    network_mode: "bridge"
    # What the runtime container should dial for RuntimeChannel. NOT the same
    # as runtime_channel_server.grpc_addr when that value is a bind address.
    # Default for host networking is "127.0.0.1:<runtime_channel_bind_port>".
    # Bridge / custom networks REQUIRE explicit value:
    # "host.docker.internal:50055" or routable LAN/service address.
    runtime_channel_dial_addr: "host.docker.internal:50055"
    label_prefix: "hushine.runtime"
    # Hosted runtime coverage is opt-in. RUNTIME_COVERAGE_ENABLED,
    # RUNTIME_COVERAGE_OUTPUT_DIR (an absolute host path), and optionally
    # RUNTIME_COVERAGE_IMAGE override these typed settings.
    coverage:
      enabled: false
      image: "hushine/strategy-runtime:executor-coverage"
      output_dir: ""
      stop_timeout_seconds: 10

notification:
  enabled: true
  kafka:
    brokers: ["127.0.0.1:9092"]
    topic: "notification.events"
    client_id: "control-panel-service"

log:
  output_dir: "./logs"
  local_file:
    enabled: true
  kafka:
    enabled: true
    brokers: ["127.0.0.1:9092"]
    topic: "app-logs"
    topic_prefix: "app-logs"
  tracing:
    enabled: true
    endpoint: "http://127.0.0.1:4318"
    service_name: "control-panel-service"
